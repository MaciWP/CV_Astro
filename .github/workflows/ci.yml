name: CI

# The Netlify production build is the deploy gate; this workflow is the
# pre-merge quality gate (lint + type check + build + domain checks + unit tests).

# Branches are verified through their PR; push runs only for main itself.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR or branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        # Version is read from package.json "packageManager" (pnpm@11.7.0).
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check (.astro + .ts via astro check)
        run: pnpm run check:types

      - name: Build (astro + responsive images via sharp)
        run: pnpm run build

      - name: Domain checks (contrast + translations + structured data)
        run: pnpm run check

      - name: Unit tests
        run: pnpm test
