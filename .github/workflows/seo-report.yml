name: SEO report

# Monthly Search Console report, opened as an issue. Needs the repo secret
# GSC_SERVICE_ACCOUNT_JSON: the JSON key of a service account added as a
# Restricted user on the Search Console property (read-only scope).
on:
  schedule:
    - cron: '17 6 2 * *' # 06:17 UTC on the 2nd of every month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build the report
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: node scripts/seo-report.js > report.md

      - name: Open the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "SEO report $(date -u +%Y-%m)" --body-file report.md
