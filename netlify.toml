# netlify.toml - build settings and redirects (headers: public/_headers)

[build]
  command = "pnpm run build"
  publish = "dist"
  # Always build. The previous ignore (git diff --quiet $CACHED_COMMIT_REF
  # $COMMIT_REF -- .) self-canceled the 2026-06-11 deploy: after a long gap
  # without git deploys, CACHED_COMMIT_REF can equal COMMIT_REF -> empty diff
  # -> exit 0 -> Netlify cancels. exit 1 forces the build unconditionally.
  ignore = "exit 1"

# Response headers live in public/_headers (the single source).

# ===== LANGUAGE REDIRECTS =====
# Redirect trailing slash versions to non-trailing (Astro uses trailingSlash: 'never')

[[redirects]]
  from = "/es/"
  to = "/es"
  status = 301

[[redirects]]
  from = "/fr/"
  to = "/fr"
  status = 301

[[redirects]]
  from = "/de/"
  to = "/de"
  status = 301

# ===== INVALID ROUTE CLEANUP =====
# Fix routes that were incorrectly generated (e.g., /es/es from previous bug)

[[redirects]]
  from = "/es/es"
  to = "/es"
  status = 301

[[redirects]]
  from = "/es/fr"
  to = "/fr"
  status = 301

[[redirects]]
  from = "/es/de"
  to = "/de"
  status = 301

[[redirects]]
  from = "/fr/es"
  to = "/es"
  status = 301

[[redirects]]
  from = "/fr/fr"
  to = "/fr"
  status = 301

[[redirects]]
  from = "/fr/de"
  to = "/de"
  status = 301

[[redirects]]
  from = "/de/es"
  to = "/es"
  status = 301

[[redirects]]
  from = "/de/fr"
  to = "/fr"
  status = 301

[[redirects]]
  from = "/de/de"
  to = "/de"
  status = 301

# ===== LOCALE-PREFIXED REGIONAL ROUTES =====
# Redirect /es/switzerland to /switzerland (regional pages are not localized)

[[redirects]]
  from = "/es/switzerland/*"
  to = "/switzerland/:splat"
  status = 301

[[redirects]]
  from = "/es/switzerland"
  to = "/switzerland"
  status = 301

[[redirects]]
  from = "/fr/switzerland/*"
  to = "/switzerland/:splat"
  status = 301

[[redirects]]
  from = "/fr/switzerland"
  to = "/switzerland"
  status = 301

[[redirects]]
  from = "/de/switzerland/*"
  to = "/switzerland/:splat"
  status = 301

[[redirects]]
  from = "/de/switzerland"
  to = "/switzerland"
  status = 301

[[redirects]]
  from = "/es/spain/*"
  to = "/spain/:splat"
  status = 301

[[redirects]]
  from = "/es/spain"
  to = "/spain"
  status = 301

[[redirects]]
  from = "/fr/spain/*"
  to = "/spain/:splat"
  status = 301

[[redirects]]
  from = "/fr/spain"
  to = "/spain"
  status = 301

[[redirects]]
  from = "/de/spain/*"
  to = "/spain/:splat"
  status = 301

[[redirects]]
  from = "/de/spain"
  to = "/spain"
  status = 301

# ===== SITEMAP CANONICALIZATION =====
# The legacy static /sitemap.xml was removed; @astrojs/sitemap emits
# sitemap-index.xml + sitemap-0.xml. Keep the old URL resolving for GSC.

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
  force = true

# ===== LEGACY .html URL CLEANUP =====
# build.format:'file' emits flat .html files that Netlify also serves directly,
# creating duplicate URLs (GSC indexed /de.html, /switzerland/zurich.html).
# force = true is required: the files exist on disk and would shadow the rule.
# NOTE: /404.html is intentionally NOT redirected (target of the 404 catch-all).

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/es.html"
  to = "/es"
  status = 301
  force = true

[[redirects]]
  from = "/fr.html"
  to = "/fr"
  status = 301
  force = true

[[redirects]]
  from = "/de.html"
  to = "/de"
  status = 301
  force = true

[[redirects]]
  from = "/spain.html"
  to = "/spain"
  status = 301
  force = true

[[redirects]]
  from = "/switzerland.html"
  to = "/switzerland"
  status = 301
  force = true

# ===== GEO CITY CONSOLIDATION (2026-06-15) =====
# The per-city pages were merged into the /switzerland and /spain hubs as
# anchored sections (doorway consolidation). Both the clean URLs (now gone)
# and their legacy .html twins 301 to the corresponding hub anchor.

[[redirects]]
  from = "/switzerland/zurich"
  to = "/switzerland#zurich"
  status = 301
[[redirects]]
  from = "/switzerland/zurich.html"
  to = "/switzerland#zurich"
  status = 301
  force = true

[[redirects]]
  from = "/switzerland/geneva"
  to = "/switzerland#geneva"
  status = 301
[[redirects]]
  from = "/switzerland/geneva.html"
  to = "/switzerland#geneva"
  status = 301
  force = true

[[redirects]]
  from = "/switzerland/basel"
  to = "/switzerland#basel"
  status = 301
[[redirects]]
  from = "/switzerland/basel.html"
  to = "/switzerland#basel"
  status = 301
  force = true

[[redirects]]
  from = "/switzerland/lausanne"
  to = "/switzerland#lausanne"
  status = 301
[[redirects]]
  from = "/switzerland/lausanne.html"
  to = "/switzerland#lausanne"
  status = 301
  force = true

[[redirects]]
  from = "/spain/madrid"
  to = "/spain#madrid"
  status = 301
[[redirects]]
  from = "/spain/madrid.html"
  to = "/spain#madrid"
  status = 301
  force = true

[[redirects]]
  from = "/spain/barcelona"
  to = "/spain#barcelona"
  status = 301
[[redirects]]
  from = "/spain/barcelona.html"
  to = "/spain#barcelona"
  status = 301
  force = true

# No catch-all 404 or http->https rules: Netlify serves /404.html for any
# missing path and forces HTTPS on its own.

# ===== BUILD ENVIRONMENT =====

[build.environment]
  NODE_VERSION = "24"
