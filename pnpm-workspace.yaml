# pnpm 11 blocks ALL dependency build scripts by default (supply-chain hardening) and
# enforces a minimumReleaseAge cooldown on new package versions. esbuild (Vite/Astro
# bundler) and sharp (image generation) are trusted native deps we depend on; their
# build scripts fetch the platform binary, so we vet and allow exactly these two.
allowBuilds:
  esbuild: true
  sharp: true

# @playform/compress pins exact transitive versions with known advisories (sharp 0.35.3,
# svgo 4.0.2, deepmerge-ts 7.1.5 via itself and @playform/pipe). Bumping compress
# cannot fix them, so force patched versions. It only uses
# deepmerge/deepmergeCustom to merge option objects; v8's breaking change (deep Map
# merging) was verified byte-identical on dist. Drop an entry once compress ships it.
# It also lists `astro: '*'` as a regular dependency, which installs a second, older
# astro (plus its Vite and advisories) next to ours; pin it to the project's astro
# through the catalog (package.json uses `catalog:` too; Dependabot updates catalogs).
catalog:
  astro: ^7.3.8

overrides:
  '@playform/compress>astro': 'catalog:'
  sharp: ^0.35.5
  svgo: ^4.1.0
  deepmerge-ts: ^8.0.2
